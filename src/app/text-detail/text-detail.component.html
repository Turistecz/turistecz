<div class="container pt-5">
  <div class="row d-flex justify-content-center align-items-center conten2">
    
    <!-- Imagen-->
    <div class="col-12 col-md-12 col-lg-6 col-xl-4 mb-md-5 mb-lg-0">
      <div class="card img_card card-radius border-0 shadow">
        <img src={{oneText.url}} class="" >
      </div>
    </div>

    <!-- Titulo y texto -->
    <div class="col-12 col-md-12 col-lg-4 col-xl-3 mt-5 mt-md-0">
      <div class="card text_card p-5 bg-txt card-radius shadow-sm p-3 border-0" >
          <a [routerLink]="['/sitios', oneText.idSitio]">
            <h1 class="titulo "> {{oneText.nombre}}</h1>
          </a>
          <p>{{oneText.texto}}</p>
      </div>
    </div>

  </div>
</div>
