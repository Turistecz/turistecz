<div class="imagen-bg-routes py-5">
  <div class="login-container">
    <div class="card login-card">
      <div class="card-body letra">
        <h3 class="card-title text-center mb-4">Recuperar Contraseña</h3>

        <form #forgotForm="ngForm" (ngSubmit)="onForgotPassword()" novalidate>
          <div class="form-group mb-3">
            <label for="email">Introduce tu correo</label>
            <input
              type="email"
              class="form-control mt-1"
              name="email"
              [(ngModel)]="email"
              required
              email
              #emailInput="ngModel"
              [class.is-invalid]="emailInput.invalid && emailInput.touched"
            >
            <div class="invalid-feedback" *ngIf="emailInput.invalid && emailInput.touched">
              Ingresa un correo válido.
            </div>
          </div>

          <div class="d-grid">
            <button 
              type="submit"
              class="btn btn-primary"
              [disabled]="forgotForm.invalid"
            >
              Enviar enlace de recuperación
            </button>
           <p class="mt-3">
                <button 
                  type="button" 
                  class="btn btn-link p-0 text-primary"
                  (click)="volverAlLogin()"
                >
                  ← Volver al login
                </button>
              </p>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
