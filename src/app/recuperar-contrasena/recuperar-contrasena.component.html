<div class="imagen-bg-routes">
  <app-breadcrumbs></app-breadcrumbs>
  <div class="login-container d-flex justify-content-center py-5">
    <div class="card login-card shadow p-4 mx-4">
      <div class="card-body letra">
        <p class="card-title h3 text-center text-capitalize mb-4">Recuperar Contraseña</p>

        <form #forgotForm="ngForm" (ngSubmit)="onForgotPassword()" novalidate>
          <div class="form-group mb-3">
            <label for="email">Introduce tu correo</label>
            <input
              type="email"
              class="form-control mt-1"
              name="email"
              [(ngModel)]="email"
              required
              email
              #emailInput="ngModel"
              [class.is-invalid]="emailInput.invalid && emailInput.touched"
            >
            <div class="invalid-feedback" *ngIf="emailInput.invalid && emailInput.touched">
              Ingresa un correo válido.
            </div>
          </div>

          <div class="d-flex justify-content-center">
            <button 
              type="submit"
              class="btn btn-personalizado text-white"
              [disabled]="forgotForm.invalid">Enviar enlace</button>

          </div>
          <div>
           <p class="mt-3">
                <button 
                  type="button" 
                  class="btn btn-link p-0 text-primary "
                  (click)="volverAlLogin()"> ← Volver al login
                </button>
              </p>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
