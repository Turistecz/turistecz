
<div class="row justify-content-center w-100  mx-2 mt-0">
    <div *ngIf="hasFilters(); else noFilters" class="saved-filters-container">
        <h3 class="m-4 fw-bold text-center"><i class="bi bi-bookmark-fill me-1" style="color:#1e6bf5;"></i>Filtros Guardados</h3>
  
    <div *ngFor="let group of groupedFilters | keyvalue: keyOrder" class="filter-group mb-4 px-3">
        <p class="fw-bold mb-3 h4">{{ group.key }}</p>
         <div class="d-flex flex-wrap gap-2">
             <span
                class="badge rounded px-2 p-2 botonBg fs-6 text-white"
                *ngFor="let filter of group.value">{{ filter.label }}
                <i class="bi bi-x-circle ms-2" role="button" title="Quitar filtro" (click)="removeFilter(filter.key)">
                 </i>
             </span>
        </div>
        <hr>
    </div>
    <div class="d-flex justify-content-center my-3">
      <button class="btn btn-personalizado fw-bold botonGuardar"(click)="onSave()">Guardar</button></div>
    </div>

    <ng-template #noFilters>
    <div class="text-center py-5">
        <i class="bi bi-inbox text-muted" style="font-size:2rem;"></i>
        <p class="text-muted mt-3">No tienes filtros guardados.</p>
    </div>
    </ng-template>
</div>
