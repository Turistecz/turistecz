<div class="card card-text mb-2 p-3 shadow-sm" role="button" (click)="abrirEnlace(a.link)"  (keydown.enter)="abrirEnlace(a.link)"  *ngFor="let a of items">

  <h5 class="mb-2">{{ a.title }}</h5>

  <!--  (interpreta <strong><abbr>Tel...</abbr></strong>)  de la api -->
  <p class="mb-2" [innerHTML]="a.descripcion"></p>

  <p class="mb-0">Email:{{ a.email || 'No disponible' }}</p>
</div>
