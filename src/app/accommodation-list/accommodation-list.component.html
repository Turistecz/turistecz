
<div class="cards-grid">
  <section *ngFor="let a of items" transition-style="in:square:hesitate">
        <article class="card card-inside p-3 shadow-sm h-100">
          <h4>{{ a.title }}</h4>
          <a [innerHTML]="a.descripcion"></a>
          <p *ngIf="a.email">Email: {{ a.email }}</p>
         <button class="ver-mas" (click)="abrirEnlace(a.link)" (keydown.enter)="abrirEnlace(a.link)"> Ver más <span class="arrow">›</span> </button>
        </article>
    </section>
</div>
