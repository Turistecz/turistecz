<h2 id="tituloSitiosHome">Sitios</h2>
<div class="mx-2 mt-2">
  <div class="row">
    <div class="col-3">
      <app-filter [places]="cards" [categories]="categoriesSites" [categoryKeywords]="categorySitesKeywords" 
      (filteredCards)="updatePlaces($event)" (noResultsPlacesEvent)="noResultsPlaces = $event"></app-filter>
    </div>

    <div class="containerCard col-7 d-block justify-content-center " 
         *ngIf="noResultsPlaces" 
         style="min-height: 300px;">
      <div class="text-center p-4 border rounded bg-light shadow-sm w-100">
        <i class="bi bi-exclamation-circle little-circle"></i>
        <p class="mt-2 mb-0 messageError">
          No se ha encontrado ningún resultado para los filtros aplicados.
        </p>
      </div>
    </div>

      <div class="containerCard col-7 " *ngIf="sortedCards.length > 0">
        <div *ngFor="let cardHome of sortedCards" class="col- col-md-3">
          <app-one-place-card [data]="cardHome"></app-one-place-card>
        </div>
      </div>

    
      
  </div> 
</div>
