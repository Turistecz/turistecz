<h2 class="display-3 fw-bold mb-3" id="tituloSitiosHome">Sitios</h2>
<div class="container ">
  <div class="row gx-4 gx-xl-5">
    <div class="col-12 col-md-5 col-lg-5 col-xl-3 mb-3">
      <app-filter [places]="cards" [categories]="categories" 
      (filteredCards)="updatePlaces($event)" (noResultsPlacesEvent)="noResultsPlaces = $event"></app-filter>
    </div>

    <div class="containerCard col-12 col-md-7 col-lg-7 col-xl-9 justify-content-center" *ngIf="sortedCards.length > 0; else noResultsTpl">
      <div *ngFor="let cardHome of pagedPlaces">
        <app-one-place-card [data]="cardHome"></app-one-place-card>
      </div>
    </div>
    <ng-template #noResultsTpl>
      <div class="col-12 col-lg-9 d-block justify-content-center">
        <div class="text-center p-4 border rounded bg-light shadow-sm w-100">
          <i class="bi bi-exclamation-circle little-circle"></i>
          <p class="mt-2 mb-0 messageError">
            No se ha encontrado ningún resultado para los filtros aplicados.
          </p>
        </div>
      </div>
    </ng-template>
    <div class="row">
      <div class="col-12 d-flex justify-content-center mt-4">
        <app-pagination
          [page]="page"
          [pageSize]="pageSize"
          [totalItems]="sortedCards.length"
          (pageChange)="onPageChange($event)">
        </app-pagination>
      </div>
    </div>
      
  </div> 
</div>
