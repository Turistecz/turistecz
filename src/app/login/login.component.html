<div class="imagen-bg-routes py-5">
  <div class="d-flex justify-content-center"> <!--login-container -->
    <div class="card login-card w-100 shadow my-2 bg-white rounded border-0">
      <div class="card-body letra p-3">
                <!-- 🔹 Login -->
        <div *ngIf="!mostrarRecuperacion">
        <h3 class="card-title text-center mb-4">Iniciar Sesión</h3>

        <form #loginForm="ngForm" (ngSubmit)="onLogin()" novalidate>
          <!-- Email -->
          <div class="form-group mb-3">
            <label for="email">Email</label>
            <input 
              type="email" 
              class="form-control mt-1" 
              name="email" 
              [(ngModel)]="email"
              required 
              email
              #emailInput="ngModel"
              [class.is-invalid]="emailInput.invalid && emailInput.touched"
            >
            <div class="invalid-feedback" *ngIf="emailInput.invalid && emailInput.touched">
              Ingresa un correo válido.
            </div>
          </div>

            <!-- Password -->
            <div class="form-group mb-4">
              <label for="password">Contraseña</label>
              <input 
                type="password"
                class="form-control mt-1"
                name="password"
                [(ngModel)]="contrasena"
                required
                #passwordInput="ngModel"
                [class.is-invalid]="passwordInput.invalid && passwordInput.touched"
              >
              <div class="invalid-feedback" *ngIf="passwordInput.invalid && passwordInput.touched">
                La contraseña es obligatoria.
              </div>
            </div>

            <div class="d-grid">
              <button 
                type="submit"
                class="btn btn-primary"
                [disabled]="loginForm.invalid"
              >
                Iniciar sesión
              </button>

              <p class="mt-3">¿No tienes cuenta? <a href="/signin">Regístrate</a></p>
              <p class="mt-2"><a href="/recuperar-contrasena" (click)="mostrarRecuperacion = true; forgotEmail = ''">¿Olvidaste tu contraseña?</a></p>
            </div>
          </form>
        </div>

        <!-- 🔹 Recuperación de contraseña -->
        <div *ngIf="mostrarRecuperacion">
          <h3 class="card-title text-center mb-4">Recuperar Contraseña</h3>

          <form #forgotForm="ngForm" (ngSubmit)="onForgotPassword()" novalidate>
            <div class="form-group mb-3">
              <label for="forgotEmail">Introduce tu correo</label>
              <input
                type="email"
                class="form-control mt-1"
                name="forgotEmail"
                [(ngModel)]="forgotEmail"
                required
                email
                #forgotEmailInput="ngModel"
                [class.is-invalid]="forgotEmailInput.invalid && forgotEmailInput.touched"
              >
              <div class="invalid-feedback" *ngIf="forgotEmailInput.invalid && forgotEmailInput.touched">
                Ingresa un correo válido.
              </div>
            </div>

            <div class="d-grid">
              <button 
                type="submit"
                class="btn btn-primary"
                [disabled]="forgotForm.invalid"
              >
                Enviar enlace
              </button>
              <p class="mt-3"><a href="#" (click)="mostrarRecuperacion = false">← Volver al login</a></p>
            </div>

            <div *ngIf="mensaje" class="alert alert-info mt-3">{{ mensaje }}</div>
          </form>
        </div>

      </div>
    </div>
  </div>
</div>
