<h3 id="tituloSitiosHome" class="py-2 text-center mb-0">Sitios que visitar</h3>

<div class="container mt-4">
  <div class="row ">
    <div *ngFor="let cardHome of cards.slice(0, this.visibleCount)"class="col-12 col-md-4 col-lg-3 ">
      <app-one-place-card [data]="cardHome"></app-one-place-card>
    </div>

    <div class="text-center my-5">
      <a href="/sitios">
        <button type="button" class="btn btn-primary btn-personalizado fs-5">Ver más</button>
      </a>
    </div>
  </div>
</div>
