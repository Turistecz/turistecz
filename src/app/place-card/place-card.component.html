<div class="container mt-5">
  <h3 id="tituloSitiosHome" class=" text-center mb-3">Sitios que visitar</h3>
  <div class="row">
    <div *ngFor="let cardHome of cards.slice(0, this.visibleCount)"class="col-12 col-md-4 col-lg-3 cards-margin">
      <app-one-place-card [data]="cardHome"></app-one-place-card>
    </div>

    <div class="text-center">
      <a href="/sitios">
        <button type="button" class="btn text-white btn-personalizado fs-5 mt-4">Ver más</button>
      </a>
    </div>
  </div>
</div>
