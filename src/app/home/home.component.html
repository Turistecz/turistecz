
<section class="shapeHome position-relative">
  <div class="container-fluid p-0">
    <div class="row g-0 ">
      <div class="col-12 ">
        <img src="pilar_home_primer.jpg" alt="Portada Zaragoza" class="img-fluid w-100 portada-img">
      </div>
      <div class="text-box col-12 position-absolute text-white px-4">
        <h1 id="titleHome">Turismo</h1>
        <h2 id="subtitleHome" class="mb-0">sin obstáculos</h2>
        <p id="sloganHome">¡Descubre Zaragoza <br>sin límites!</p>
      </div>
    </div>
  </div>
</section>

<!--prueba de temperatura-->
<div class="container">
  <div class="row">
    <div class="col-2 d-flex m-2 p-2">
      <button type="button" class="d-flex btn btn-dark text-light align-items-center"> 
        <p class="me-2 mb-0" *ngIf="current">{{current.temperature_2m}} ºC </p>
        <i class="fas {{getWeatherIcon(current)}}"></i>
      </button>
    </div> 
  </div>
</div>
