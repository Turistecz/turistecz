<h1 class="mb-3 text-center display-3 fw-bold">
  Calendario
</h1>
<div class="container calendar-container px-md-5">
  <div class="row">
    <div class="col-12 col-lg-6 ">
      <article class="calendar-card shadow-lg border-0  ">
        <igx-calendar 
          #calendar 
          [weekStart]="1"  
          locale="es-ES"
          selection="single" 
          (selected)="onDateSelected($event)">
        </igx-calendar>
      </article>
    </div>

    <!--Eventos -->
    <div class="col-12 col-lg-6 mt-4 mt-lg-0 mb-3 " *ngIf="eventsOfDay.length > 0">
      <div class="calendar-card shadow-lg events-container overflow-y-auto border-0">
        
        <!-- Encabezado -->
        <div class="title-events p-4 text-white text-center rounded-top "
             style="background: linear-gradient(90deg, #1e6bf5, #0e3d89);">
          <h2 class="fs-2 m-0">
            Eventos del {{selectedDate | date:"EEEE d 'de' MMMM y":'':'es' }}
          </h2>
        </div>

        <!-- Tarjeta por evento -->
        <div *ngFor="let ev of eventsOfDay" 
             class="event-item text-start shadow-sm m-3 p-3 rounded border border-light"
             style="background:#f8fbff;">
          
          <!-- Título -->
          <h5 class="eventTitle py-1">{{ev.title}}</h5>



    <!-- Sin eventos -->
    <div class="col-12 col-lg-6 mt-4 mt-lg-0" *ngIf="selectedDate && eventsOfDay.length === 0">
      <div class="calendar-card shadow-sm text-center p-4">
        <h5 class="text-muted">
          <i class="fas fa-info-circle me-2"></i>
          No hay eventos para {{selectedDate | date:"EEEE d 'de' MMMM y":'':'es' }}.
        </h5>
      </div>
    </div>
  </div>
</div>
