<div class="container">
  <!-- MOSTRAR RUTAS DEL USUARIO -->
  <h2>Mis rutas</h2>
  <!-- Cuando el usuario no ha creado ninguna ruta -->
  <p>Todavía no has creado ninguna ruta ¡Anímate a crear la primera!</p>
  <!-- Cuando el usuario ha creado rutas -->
  <div class="row mb-3">
    <div class="col-3" *ngFor="let dato of datosRutasCreadas">
      <div class="card" >
        <!-- Imagen ruta -->
        <p> Titulo: {{ dato.titulo_ruta }}</p>
        <p> Descripcion: {{ dato.descripcion_ruta }}</p>
        <!-- PENDIENTE: <p> Sitios de la ruta: </p> -->
      </div>
    </div>
  </div>

  <!-- PENDIENTE: Modificar ruta, Eliminar ruta -->

  <!-- CREAR NUEVA RUTA -->
  <button class="btn btn-primary mb-3" data-bs-toggle="collapse" data-bs-target="#collapseFormNewRoute" aria-expanded="false" aria-controls="collapseExample">Crear Nueva Ruta</button>
  <div class="collapse" id="collapseFormNewRoute">
    <div class="card card-body mb-3">
      <form [formGroup]="formularioNuevaRuta" (ngSubmit)="onSubmit()">
        <!-- Imagen ruta -->
        <!-- Titulo ruta -->
        <label for="titulo_ruta" class="form-label">Título de la Ruta</label>
        <input type="text" id="titulo_ruta" class="form-control" formControlName="titulo_ruta">
        <div *ngIf="formularioNuevaRuta.get('titulo_ruta')?.invalid && formularioNuevaRuta.get('titulo_ruta')?.touched">
          El titulo es obligatorio
        </div>
        <!-- Descripcion ruta -->
        <label for="descripcion_ruta" class="form-label">Descripcion</label>
        <input type="text" id="descripcion_ruta" class="form-control" formControlName="descripcion_ruta">
        <!-- Seleccionar sitios -->
        <label class="form-label mt-3">Selecciona los sitios que quieres incluir en tu ruta:</label>
        <div *ngFor="let sitio of sitiosFavoritosUsuario" class="mt-3">
          <input class="form-check-input me-2" type="checkbox" [value]="sitio.id" (change)="onCheckboxChange($event, sitio.id)">
          <label class="form-check-label">{{ sitio.nombre }}</label> 
        </div>
        <!-- Ordenar sitios -->
        <!-- Botones -->
        <button type="reset" class="btn btn-primary mt-3 me-3">Cancelar</button>
        <button type="submit" [disabled]="formularioNuevaRuta.invalid" class="btn btn-primary mt-3">Guardar</button>
      </form>
    </div>
  </div>
</div>
