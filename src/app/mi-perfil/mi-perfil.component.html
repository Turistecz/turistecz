<div class="container-fluid mb-2">
  <div class="row">
    <!-- Menú de pestañas -->
    <div class="col-12 col-md-4 col-lg-2 mb-4">
      
        <div class="nav nav-pills flex-row flex-md-column fw-bold shadow fs-5 fs-md-3 menu text-center justify-content-between" id="v-pills-tab" role="tablist" aria-orientation="vertical">
          <button class="nav-link active" id="v-pills-home-tab" data-bs-toggle="pill" data-bs-target="#v-pills-home" type="button" role="tab" aria-controls="v-pills-home" aria-selected="true">Mis Sitios</button>
          <button class="nav-link " id="v-pills-routes-tab" data-bs-toggle="pill" data-bs-target="#v-pills-routes" type="button" role="tab" aria-controls="v-pills-routes" aria-selected="false">Mis Rutas</button>
          <button class="nav-link" id="v-pills-agenda-tab" data-bs-toggle="pill" data-bs-target="#v-pills-agenda" type="button" role="tab" aria-controls="v-pills-agenda" aria-selected="false">Agenda</button>
          <button class="nav-link" id="v-pills-chatbot-tab" data-bs-toggle="pill" data-bs-target="#v-pills-chatbot" type="button" role="tab" aria-controls="v-pills-chatbot" aria-selected="false">Chatbot</button>
        </div>
      </div>
    
  
     <!-- Contenido de pestañas -->
      <div class="col-12 col-md-9 col-lg-10">
        <div class="tab-content" id="v-pills-tabContent">
        <!-- Mis Sitios -->
          <div class="tab-pane fade show active px-2" id="v-pills-home" role="tabpanel" aria-labelledby="v-pills-home-tab">
            <div class="container-fluid">
              <div class="row">
                <div *ngFor="let favorito of favoritos" class="col-12 col-md-6 col-lg-3 mb-4">
                  <app-one-place-card 
                    [data]="favorito" 
                    (favoritoEliminado)="onFavoritoEliminado($event)">
                  </app-one-place-card>
                </div>
              </div>
            </div>
          </div>
        <div class="tab-pane fade" id="v-pills-routes" role="tabpanel" aria-labelledby="v-pills-routes-tab">
          <app-custom-route></app-custom-route>
        </div>


        <div class="tab-pane fade" id="v-pills-agenda" role="tabpanel" aria-labelledby="v-pills-agenda-tab">
          <app-calendar></app-calendar>
        </div>

      <!-- Chatbot -->
        <div class="tab-pane fade" id="v-pills-chatbot" role="tabpanel" aria-labelledby="v-pills-chatbot-tab">
          <div id="landbot-container" style="height:600px;">
          </div>
        </div>
    </div>
  </div>
  </div>
</div>
