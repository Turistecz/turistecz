<div class="container mt-5">
  <h2>Restablecer contraseña</h2>

  <div *ngIf="mensaje" class="alert"
       [ngClass]="{'alert-success': tipoMensaje==='success', 'alert-danger': tipoMensaje==='error'}">
    {{ mensaje }}
  </div>

  <form [formGroup]="form" (ngSubmit)="resetPassword()" *ngIf="token && tipoMensaje !== 'success'">
    
    <div class="mb-3">
      <label for="nuevaContrasena" class="form-label">Nueva contraseña</label>
      <input type="password" id="nuevaContrasena" formControlName="nuevaContrasena" class="form-control">
      <small *ngIf="form.get('nuevaContrasena')?.touched && form.get('nuevaContrasena')?.errors?.['required']" class="text-danger">
        La contraseña es obligatoria.
      </small>
      <small *ngIf="form.get('nuevaContrasena')?.touched && form.get('nuevaContrasena')?.errors?.['minlength']" class="text-danger">
        Debe tener al menos 6 caracteres.
      </small>
    </div>

    <div class="mb-3">
      <label for="confirmarContrasena" class="form-label">Confirmar contraseña</label>
      <input type="password" id="confirmarContrasena" formControlName="confirmarContrasena" class="form-control">
      <small *ngIf="form.hasError('noCoinciden')" class="text-danger">
        Las contraseñas no coinciden.
      </small>
    </div>

    <button type="submit" class="btn btn-primary"
            [disabled]="form.invalid || cargando">
      {{ cargando ? 'Procesando...' : 'Restablecer contraseña' }}
    </button>
  </form>
</div>
