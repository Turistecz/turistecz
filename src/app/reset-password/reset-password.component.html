<div class="imagen-bg-routes py-5">
  <div class="d-flex justify-content-center">
    <div class="card shadow p-4" style="max-width: 600px; width: 100%;">
      <h3 class="card-title text-center mb-4">Recuperación de contraseña</h3>
      <div class="card-body">
        <form [formGroup]="form" (ngSubmit)="resetPassword()">
         <div *ngIf="mensaje" [ngClass]="{'error': tipoMensaje === 'error', 'success': tipoMensaje === 'success'}">
                {{ mensaje }}
              </div>      
           
          
          <div class="form-group mt-3">           
            <label for="nueva">Nueva Contraseña</label>
            <input id="nueva" type="password"  class="form-control" formControlName="nuevaContrasena" />
             
         <div *ngIf="form.get('nuevaContrasena')?.touched && form.get('nuevaContrasena')?.errors?.['minlength']">
                La contraseña debe tener al menos 6 caracteres
          </div>
      
         
          <div class="form-group mt-3">
            <label for="confirmar">Confirmar contraseña</label>
            <input
              id="confirmar" type="password"
              class="form-control"
              formControlName="confirmarContrasena" />          
            <div *ngIf="form.errors?.['noCoinciden']">
               Las contraseñas no coinciden.
                </div>   
     
          <div class="text-center mt-4">
             <button type="submit" class="btn btn-primary w-100">Cambiar contraseña</button>               
          </div>

              </div>
            </div>    
          </form>        
        </div>
      </div>
    </div>
  </div>
