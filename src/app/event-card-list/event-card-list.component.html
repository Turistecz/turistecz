<div class="container container-events">
  <div class="row">
    <div class="col-12">
      <h2 class="fw-bold mb-4 mt-5 text-center bloque py-1">Eventos</h2>
    </div>
  </div>


  <!-- FILTROS + EVENTOS -->
  <div class="row mx-2">
    <!-- FILTROS -->
    <div class="col-12 col-lg-3 mb-4 mb-lg-0">
      <app-filter [events]="events" [categories]="categoriesEvents" (filteredEvents)="updateEvents($event)">
      </app-filter>
    </div>

    <!-- LISTA DE EVENTOS -->
    <div class="col-12 col-lg-8">
      <div class="row">
        <div class="col-12 col-md-6 col-lg-4 event-card-list"
            *ngFor="let event of pagedEvents; let i = index">
          <app-event-card [data]="event" [bg]="i % 2 === 0"></app-event-card>
        </div>
      </div>

      <!-- PAGINACIÓN -->
      <div class="row">
        <div class="col-12 d-flex justify-content-center mt-4">
          <app-pagination
            [page]="page"
            [pageSize]="pageSize"
            [totalItems]="sortedEvents.length"
            (pageChange)="onPageChange($event)">
          </app-pagination>
        </div>
      </div>
    </div>
  </div>
</div>
