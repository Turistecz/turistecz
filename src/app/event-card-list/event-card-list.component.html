<!-- CONTADOR -->
<p id="textShowEvents" class="text-muted text-center w-100"> Mostrando <strong>{{ pagedEvents.length }}</strong> de <strong>{{ sortedEvents.length }}</strong> eventos — Página <strong>{{ page }}</strong> de <strong>{{ totalPages }}</strong></p>
<br>

<!-- LISTADO DE EVENTOS -->
<div class="main-card row">
  <div class="event-card-list col-12 col-md-6 col-lg-4" *ngFor="let event of pagedEvents; let i = index">
    <app-event-card [data]="event" [bg]="i % 2 === 0"></app-event-card>
  </div>
</div>

<!-- BARRA DE PAGINACION -->
<nav class="my-3">
  <ul class="pagination justify-content-center">
    <li class="page-item" [class.disabled]="page == 1">
      <button class="page-link" (click)="goToPage(1)" [disabled]="page === 1">&laquo;</button>
    </li>
    <li class="page-item" [class.disabled]="page == 1">
      <button class="page-link" (click)="prevPage()" [disabled]="page === 1">Anterior</button>
    </li>
    <li class="page-item" *ngFor="let p of pagesToShow" [class.active]="page === p">
      <button class="page-link" (click)="goToPage(p)">{{ p }}</button>
    </li>
    <li class="page-item" [class.disabled]="page == totalPages">
      <button class="page-link" (click)="nextPage()" [disabled]="page === totalPages">Siguiente</button>
    </li>
    <li class="page-item" [class.disabled]="page == totalPages">
      <button class="page-link" (click)="goToPage(totalPages)" [disabled]="page === totalPages">&raquo;</button>
    </li>
  </ul>
</nav>
