<!-- MIGAS DE PAN -->
<div class="breadcrumb-events fw-bold ms-5 mt-3">
  <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/">Home</a></li>
      <li class="breadcrumb-item active" aria-current="page">Eventos</li>
    </ol>
  </nav>
</div>

<!-- TITULO -->
<div class="row">
  <div class="col-12">
    <h2 class="fw-bold mb-5 text-center bloque py-1">Eventos</h2>
  </div>
</div>

<!-- FILTROS + EVENTOS -->
<div class="row">
  <!-- FILTROS -->
  <div class="col-12 col-lg-3 filters mb-4 mb-lg-0">
    <app-filter [events]="events" 
                [categories]="categoriesEvents" 
                [categoryKeywords]="categoryEventsKeywords" 
                (filteredEvents)="updateEvents($event)">
    </app-filter>
  </div>

  <!-- LISTADO EVENTOS -->
  <div class="col-12 col-lg-8">
    <div class="main-card row">
      <div class="event-card-list col-12 col-md-6 col-lg-4"
           *ngFor="let event of pagedEvents; let i = index">
        <app-event-card [data]="event" [bg]="i % 2 === 0"></app-event-card>
      </div>
    </div>

    <!-- PAGINACIÓN -->
    <nav class="my-3">
      <ul class="pagination justify-content-center">
        <li class="page-item" [class.disabled]="page == 1">
          <button class="page-link" (click)="goToPage(1)" [disabled]="page === 1">&laquo;</button>
        </li>
        <li class="page-item" [class.disabled]="page == 1">
          <button class="page-link" (click)="prevPage()" [disabled]="page === 1">Anterior</button>
        </li>
        <li class="page-item" *ngFor="let p of pagesToShow" [class.active]="page === p">
          <button class="page-link" (click)="goToPage(p)">{{ p }}</button>
        </li>
        <li class="page-item" [class.disabled]="page == totalPages">
          <button class="page-link" (click)="nextPage()" [disabled]="page === totalPages">Siguiente</button>
        </li>
        <li class="page-item" [class.disabled]="page == totalPages">
          <button class="page-link" (click)="goToPage(totalPages)" [disabled]="page === totalPages">&raquo;</button>
        </li>
      </ul>
    </nav>

    <!-- CONTADOR -->
    <p id="textShowEvents" class="text-muted text-center w-100">
      Mostrando <strong>{{ pagedEvents.length }}</strong> de
      <strong>{{ sortedEvents.length }}</strong> eventos — Página
      <strong>{{ page }}</strong> de <strong>{{ totalPages }}</strong>
    </p>
  </div>
</div>
