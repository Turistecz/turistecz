
<div class="main-card container mb-5">
  <div class="row">
    <div class="col-12">
      <h3 class="text-center pb-4">Eventos</h3>
    </div>
  </div>

<div class="position-relative"> 
  <div id="eventsCarousel" class="carousel slide carousel-dark" data-bs-ride="true"> 
    <div class="carousel-inner py-2"> 
      <div class="carousel-item active" data-bs-interval="5000" *ngFor="let events of eventGroups; let i = index" [class.active]="i === 0" > 
        <div class="row row-cols-1 row-cols-md-3 row-cols-lg-3 g-3 justify-content-center px-5"> 
          <div class="col justify-content-center " *ngFor="let event of events; let j = index"> 
            <app-event-card [data]="event" [bg]="((i * 3) + j) % 2 === 0"></app-event-card> 
          </div> 
        </div> 
      </div> 
    </div> 
    <button class="carouselButton carousel-control-prev position-absolute" type="button" data-bs-target="#eventsCarousel" data-bs-slide="prev"> 
      <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="currentColor" class="bi bi-caret-left-fill" viewBox="0 0 16 16">
        <path fill="#184591" d="m3.86 8.753 5.482 4.796c.646.566 1.658.106 1.658-.753V3.204a1 1 0 0 0-1.659-.753l-5.48 4.796a1 1 0 0 0 0 1.506z"/>
      </svg>
    </button> 
    <button class="carouselButton carousel-control-next position-absolute" type="button" data-bs-target="#eventsCarousel" data-bs-slide="next"> 
      <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="currentColor" class="bi bi-caret-right-fill" viewBox="0 0 16 16">
        <path fill="#184591" d="m12.14 8.753-5.482 4.796c-.646.566-1.658.106-1.658-.753V3.204a1 1 0 0 1 1.659-.753l5.48 4.796a1 1 0 0 1 0 1.506z"/>
      </svg>
    </button> 
  </div> 
</div>
<div class="text-center my-5">
      <a href="/eventos">
        <button type="button" class="btn-sites btn btn-primary fs-5">Ver más</button>
      </a>
    </div> 
</div>
